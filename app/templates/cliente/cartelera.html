{% extends "base.html" %}
{% block title %}Cartelera | Cine Paradiso{% endblock %}
{% block content %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/configuracion.css') }}">
<h1>Cartelera</h1>

<a class="config-trigger"
    href="{{ url_con_filtros('cliente.configurar_formato') }}">
    Formato
    <span aria-hidden="true">›</span>
</a>
<a class="config-trigger"
    href="{{ url_con_filtros('cliente.configurar_idioma') }}">
    Idioma
    <span aria-hidden="true">›</span>
</a>

<section class="filters panel">Filtros por local y fecha</section>
<section class="card-grid">
    <article class="card"><h2>Película</h2><p>La cartelera se cargará desde la API.</p></article>
</section>
{% block filter_sidebar %}{% endblock %}
{% endblock %}
