{% extends "base.html" %}
{% block title %}Iniciar sesión | Cine Paradiso{% endblock %}
{% block content %}
<section class="panel narrow">
    <h1>Iniciar sesión</h1>
    <form id = "Formulario-login" class="form-stack" method="POST" action="{{ url_for('auth.login') }}">
        <label>Email <input id = "email" type="email" name="email" required></label>
        <label>Contraseña <input id = "password" type="password" name="password" required></label>
        <button type="submit">Ingresar</button>
    </form>
    <a href="{{ url_for('auth.registro') }}">Crear una cuenta</a>
</section>
<script src="{{ url_for('static', filename='js/login.js') }}"></script>
{% endblock %}
